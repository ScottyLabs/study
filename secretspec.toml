[project]
name = "study"
revision = "1.0"

[providers]
local = "dotenv://.env"
vault = "vault://secrets.scottylabs.org/secret"

[profiles.ci.defaults]
required = false

[profiles.default]
ADMIN_GROUP = { description = "Keycloak group granting admin access" }
ALLOWED_ORIGINS_REGEX = { description = "Regex matching allowed CORS origins" }
AUTH_ISSUER = { description = "Keycloak realm issuer URL" }
AUTH_JWKS_URI = { description = "Keycloak realm JWKS URL" }
AUTH_CLIENT_ID = { description = "OIDC client ID" }
AUTH_CLIENT_SECRET = { description = "OIDC client secret" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL" }
BETTER_AUTH_SECRET = { description = "Secret used to sign better-auth sessions" }
SENTRY_DSN = { description = "Sentry DSN", required = false }

[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["vault"]

[profiles.dev]
