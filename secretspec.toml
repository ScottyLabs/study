[project]
name = "study"
revision = "1.0"

[providers]
local = "dotenv://.env"
openbao = "openbao://secrets.scottylabs.org/secret"
openbao-ci = "openbao://secrets.scottylabs.org/secret?auth=jwt&role=ci&audience=openbao"

[profiles.default]
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm name" }
OIDC_CLIENT_ID = { description = "OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "OIDC client secret" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL" }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path" }
ALLOWED_ORIGINS_REGEX = { description = "Regex matching allowed CORS origins" }
BETTER_AUTH_SECRET = { description = "Secret used to sign better-auth sessions" }
SENTRY_DSN = { description = "Sentry DSN", required = false }

[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["openbao"]

[profiles.dev]

[profiles.ci.defaults]
required = false
providers = ["openbao-ci"]

[profiles.ci]
