name: Test

on:
  pull_request:
  push:

concurrency:
  group: native-postgres-tests
  cancel-in-progress: false

jobs:
  test:
    name: Unit and integration tests
    runs-on: native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect native runtime
        run: |
          uname -a
          uname -m
          cat /etc/os-release || true
          command -v node
          node --version
          command -v npm
          npm --version
          ldd --version || true
          command -v nix
          nix --version
          command -v nix-shell

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit

      - name: Run PostgreSQL-backed tests with temporary Nix database
        run: nix-shell --run "bash test/run-postgres-integration.sh"
