name: Test

on:
  push:

concurrency:
  group: native-postgres-tests
  cancel-in-progress: false

jobs:
  unit:
    name: Unit tests
    runs-on: native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect native runtime
        run: |
          uname -a
          uname -m
          cat /etc/os-release || true
          command -v node
          node --version
          command -v npm
          npm --version
          ldd --version || true
          command -v nix
          nix --version
          command -v nix-shell

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests
    needs: unit
    runs-on: native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker is available
        run: docker version

      - name: Start temporary PostgreSQL database
        run: |
          docker rm --force studystarter-ci-postgres 2>/dev/null || true
          docker run --detach --rm \
            --name studystarter-ci-postgres \
            --env POSTGRES_DB=studystarter_test \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --publish 127.0.0.1:54329:5432 \
            postgres:16-alpine

          until docker exec studystarter-ci-postgres pg_isready \
            --username postgres --dbname studystarter_test; do
            sleep 1
          done

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client and apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/studystarter_test
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run integration tests
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:54329/studystarter_test
        run: npm run test:integration

      - name: Stop temporary PostgreSQL database
        if: always()
        run: docker rm --force studystarter-ci-postgres || true

  deploy-dev:
    name: Deploy to Dev
    needs: integration
    if: forgejo.ref != 'refs/heads/main'
    runs-on: native

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Deploy to Railway Dev
        run: npm exec --yes --package=@railway/cli -- railway up --ci --service "CMU Study" --environment dev
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}

  deploy-prod:
    name: Deploy to Production
    needs: integration
    if: forgejo.ref == 'refs/heads/main'
    runs-on: native

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Deploy to Railway Production
        run: npm exec --yes --package=@railway/cli -- railway up --ci --service "CMU Study" --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
