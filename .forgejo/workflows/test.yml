name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  id-token: write

concurrency:
  group: study-tests-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: native

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests
    needs: unit
    runs-on: native
    env:
      SECRETSPEC_PROFILE: ci

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Start local devenv services
        run: |
          devenv up -d
          devenv processes wait

      - name: Install dependencies, migrate, and run integration tests
        run: |
          devenv shell -- npm ci
          devenv shell -- migrate
          devenv shell -- sh -c 'CALENDAR_TEST_DATABASE_URL="$DATABASE_URL" npm run test:integration'

      - name: Stop local devenv services
        if: always()
        run: devenv down || true
